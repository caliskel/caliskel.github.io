<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MLBB Codex — Hero Database</title>
<meta name="description" content="A Mobile Legends: Bang Bang hero database. Browse every hero, filter by lane and sort by the current meta." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0e14;
    --bg2: #0e121a;
    --panel: #121823;
    --panel-hi: #18202d;
    --line: rgba(255,255,255,0.07);
    --line-2: rgba(255,255,255,0.12);
    --accent: #4d8dff;
    --accent-bri: #7aa8ff;
    --accent-dim: rgba(77,141,255,0.13);
    --accent-glow: rgba(77,141,255,0.35);
    --green: #43d39e;
    --red: #ff647d;
    --text: #e7ecf3;
    --muted: #828d9c;
    --muted-2: #59616e;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; line-height: 1.5; min-height: 100vh; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(77,141,255,0.10), transparent 60%),
      radial-gradient(700px 500px at 0% 0%, rgba(77,141,255,0.05), transparent 55%); }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px; }
  .mono { font-family: var(--mono); }

  /* HEADER */
  header.top { position: sticky; top: 0; z-index: 40; background: rgba(11,14,20,0.85); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 18px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .mk { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #2f6ad9); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; letter-spacing: 0.5px; box-shadow: 0 4px 16px -4px var(--accent-glow); }
  .brand .nm { font-weight: 800; font-size: 17px; letter-spacing: 0.5px; }
  .brand .nm b { color: var(--accent); }
  .top .spacer { flex: 1; }
  .search { position: relative; width: min(340px, 42vw); }
  .search input { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px 10px 38px; color: var(--text); font-size: 14px; font-family: var(--sans); outline: none; transition: border-color .15s, box-shadow .15s; }
  .search input::placeholder { color: var(--muted-2); }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .search::before { content: "⌕"; position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 17px; }
  .credit { font-size: 12px; color: var(--muted-2); font-family: var(--mono); }
  .credit a { color: var(--muted); }
  .credit a:hover { color: var(--accent); }
  @media (max-width: 820px) { .credit { display: none; } }
  @media (max-width: 560px) { .brand .nm { font-size: 15px; } .search { width: 100%; } }

  /* PAGE TITLE STRIP */
  .pagehead { padding: 30px 0 6px; }
  .pagehead h1 { font-size: clamp(26px, 4vw, 38px); font-weight: 800; letter-spacing: -0.5px; }
  .pagehead .tag { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .pagehead .tag .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }

  /* APP LAYOUT */
  .app { display: grid; grid-template-columns: 222px 1fr; gap: 30px; padding: 22px 0 70px; align-items: start; }

  /* SIDEBAR */
  .side { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 26px; }
  .side .sec-t { font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted-2); margin-bottom: 10px; padding-left: 2px; }
  .navi { display: flex; flex-direction: column; gap: 3px; }
  .navi button { display: flex; align-items: center; justify-content: space-between; width: 100%; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 9px 11px; color: var(--muted); font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; transition: all .14s; text-align: left; }
  .navi button .ct { font-family: var(--mono); font-size: 11px; color: var(--muted-2); transition: color .14s; }
  .navi button:hover { background: var(--panel); color: var(--text); }
  .navi button:hover .ct { color: var(--muted); }
  .navi button.on { background: var(--accent-dim); color: var(--accent-bri); border-color: rgba(77,141,255,0.3); }
  .navi button.on .ct { color: var(--accent); }

  /* CONTENT */
  .content { min-width: 0; }
  .count { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 16px; }
  .count b { color: var(--text); font-weight: 600; }

  /* GRID */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 14px; }
  .hero { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; overflow: hidden; transition: transform .16s, border-color .16s, box-shadow .16s; position: relative; }
  .hero:hover { transform: translateY(-4px); border-color: rgba(77,141,255,0.5); box-shadow: 0 14px 30px -16px rgba(0,0,0,0.85), 0 0 0 1px rgba(77,141,255,0.25); }
  .hero .pic { aspect-ratio: 1/1; background: var(--bg2); position: relative; overflow: hidden; }
  .hero .pic img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; transition: transform .3s; }
  .hero:hover .pic img { transform: scale(1.07); }
  .hero .pic::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(11,14,20,0.92)); }
  .hero .wr { position: absolute; top: 8px; right: 8px; z-index: 2; font-family: var(--mono); font-weight: 700; font-size: 11px; padding: 3px 7px; border-radius: 6px; background: rgba(11,14,20,0.78); backdrop-filter: blur(4px); border: 1px solid var(--line); letter-spacing: 0; color: var(--muted); }
  .hero .wr.good { color: var(--green); border-color: rgba(67,211,158,0.35); }
  .hero .wr.bad { color: var(--red); border-color: rgba(255,100,125,0.32); }
  .hero .nm { position: absolute; left: 0; right: 0; bottom: 28px; z-index: 2; text-align: center; font-weight: 700; font-size: 14px; letter-spacing: 0.2px; padding: 0 6px; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
  .hero .rl { padding: 7px 6px 9px; text-align: center; font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; position: relative; z-index: 2; }
  .empty { color: var(--muted); padding: 60px 0; text-align: center; grid-column: 1/-1; font-family: var(--mono); font-size: 13px; }

  /* MOBILE */
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; gap: 14px; padding-top: 16px; }
    .side { position: static; top: auto; gap: 14px; }
    .side .sec-t { margin-bottom: 7px; }
    .navi { flex-direction: row; gap: 6px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
    .navi button { width: auto; white-space: nowrap; background: var(--panel); border-color: var(--line); padding: 8px 13px; border-radius: 999px; font-size: 13px; }
    .navi button.on { background: var(--accent-dim); }
    .navi button .ct { display: none; }
  }

  footer { border-top: 1px solid var(--line); }
  footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 22px 24px 40px; color: var(--muted-2); font-size: 12px; font-family: var(--mono); }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <span class="mk">ML</span>
        <div class="nm">MLBB <b>CODEX</b></div>
      </div>
      <div class="spacer"></div>
      <label class="search"><input id="search" type="text" placeholder="Search hero…" autocomplete="off" /></label>
      <div class="credit">by <a href="https://caliskel.github.io" target="_blank" rel="noopener">caliskel</a></div>
    </div>
  </header>

  <main class="wrap">
    <div class="pagehead">
      <h1>Hero Database</h1>
      <div class="tag"><span class="dot"></span> Mobile Legends · Bang Bang · live meta</div>
    </div>

    <div class="app">
      <aside class="side">
        <div>
          <div class="sec-t">Lane</div>
          <div class="navi" id="roles"></div>
        </div>
        <div class="sortwrap">
          <div class="sec-t">Sort by</div>
          <div class="navi" id="sortnav"></div>
        </div>
      </aside>

      <section class="content">
        <div class="count" id="count"></div>
        <div class="grid" id="grid"></div>
      </section>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <div>Data · open MLBB API &amp; Fandom wiki</div>
      <div>© <span id="yr"></span> MLBB Codex · made by <a href="https://caliskel.github.io" target="_blank" rel="noopener">caliskel</a></div>
    </div>
  </footer>

  <script src="./data/heroes.js"></script>
  <script>
    const HEROES = (window.MLBB_HEROES || []).filter(h => h.name);
    document.getElementById("yr").textContent = new Date().getFullYear();

    const ROLE_EN = { "Exp Lane": "Exp", "Gold Lane": "Gold", "Jungle": "Jungle", "Mid Lane": "Mid", "Roam": "Roam" };
    const ALL_ROLES = ["Exp Lane", "Jungle", "Mid Lane", "Gold Lane", "Roam"];
    const SORTS = [["name", "Name"], ["win", "Win rate"], ["ban", "Ban rate"], ["pick", "Pick rate"]];
    let q = "", role = "all", sort = "name";

    function roleCount(r) { return HEROES.filter(h => (h.roles || []).includes(r)).length; }

    const rolesEl = document.getElementById("roles");
    const sortNavEl = document.getElementById("sortnav");

    function navBtn(active, label, count, ds) {
      const b = document.createElement("button");
      if (active) b.className = "on";
      b.innerHTML = '<span class="lbl">' + label + '</span>' + (count != null ? '<span class="ct">' + count + '</span>' : '');
      Object.assign(b.dataset, ds);
      return b;
    }

    function renderRoles() {
      rolesEl.innerHTML = "";
      rolesEl.appendChild(navBtn(role === "all", "All heroes", HEROES.length, { role: "all" }));
      ALL_ROLES.forEach(r => rolesEl.appendChild(navBtn(role === r, ROLE_EN[r] || r, roleCount(r), { role: r })));
    }
    function renderSortNav() {
      sortNavEl.innerHTML = "";
      SORTS.forEach(([v, label]) => sortNavEl.appendChild(navBtn(sort === v, label, null, { sort: v })));
    }

    rolesEl.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; role = b.dataset.role; renderRoles(); render(); });
    sortNavEl.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; sort = b.dataset.sort; renderSortNav(); render(); });
    document.getElementById("search").addEventListener("input", (e) => { q = e.target.value.trim().toLowerCase(); render(); });

    function wrClass(w) { return w == null ? "" : (w >= 50 ? "good" : "bad"); }

    function filtered() {
      let list = HEROES.filter(h => {
        if (q && !h.name.toLowerCase().includes(q)) return false;
        if (role !== "all" && !(h.roles || []).includes(role)) return false;
        return true;
      });
      list.sort((a, b) => sort === "name" ? a.name.localeCompare(b.name) : ((b[sort] ?? -1) - (a[sort] ?? -1)));
      return list;
    }

    const grid = document.getElementById("grid");
    function render() {
      const list = filtered();
      document.getElementById("count").innerHTML = "<b>" + list.length + "</b> " + (list.length === 1 ? "hero" : "heroes");
      if (!list.length) { grid.innerHTML = '<div class="empty">No heroes found</div>'; return; }
      grid.innerHTML = list.map(h => {
        const roles = (h.roles || []).map(r => ROLE_EN[r] || r).join(" · ");
        return '<a class="hero" href="./hero.html?id=' + h.id + '&v=13">' +
          '<div class="pic"><img loading="lazy" src="' + h.img + '" alt="' + h.name + '" />' +
          (h.win != null ? '<span class="wr ' + wrClass(h.win) + '">' + h.win.toFixed(0) + '%</span>' : '') +
          '<div class="nm">' + h.name + '</div></div>' +
          '<div class="rl">' + (roles || '—') + '</div></a>';
      }).join("");
    }
    renderRoles(); renderSortNav(); render();
  </script>
</body>
</html>
