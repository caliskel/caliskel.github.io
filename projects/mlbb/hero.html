<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hero — MLBB Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #07070c; --bg2: #0e0d14; --panel: #141220; --panel2: #1b1830;
    --line: rgba(232,201,134,0.14); --line-soft: rgba(255,255,255,0.07); --gold: #e8c986; --gold-bright: #f7e3a8; --gold-deep: #b8902f;
    --grad-gold: linear-gradient(135deg, #f7e3a8, #c79a3a 60%, #8a6a1f);
    --green: #5fd6a0; --red: #e8728a; --blue: #7aa2ff;
    --text: #ece7df; --muted: #9a917f;
    --disp: "Cinzel", serif; --body: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; line-height: 1.55; }
  body::before { content:""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background: radial-gradient(1000px 600px at 50% -15%, rgba(199,154,58,0.14), transparent 60%), radial-gradient(800px 600px at 100% 10%, rgba(120,90,200,0.07), transparent 55%); }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 22px; }
  .gold-text { background: var(--grad-gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

  header.top { position: sticky; top: 0; z-index: 30; background: rgba(7,7,12,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 16px; height: 64px; }
  .back { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; font-weight: 600; transition: color .2s; }
  .back:hover { color: var(--gold); }
  .top .brand { font-family: var(--disp); font-weight: 700; letter-spacing: 1px; margin-left: auto; font-size: 16px; }

  /* HERO BANNER */
  .banner { position: relative; margin-top: 20px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); min-height: 360px; display: flex; align-items: flex-end; }
  .banner .art { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(30px) brightness(0.4) saturate(1.15); transform: scale(1.25); }
  .banner .portrait { position: absolute; right: 0; top: 0; bottom: 0; width: 58%; max-width: 520px; background-size: cover; background-position: center 30%;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 50%); mask-image: linear-gradient(90deg, transparent 0%, #000 50%); }
  .banner .scrim { position: absolute; inset: 0; background:
    linear-gradient(180deg, rgba(7,7,12,0.15) 0%, rgba(7,7,12,0.45) 55%, rgba(7,7,12,0.92) 100%),
    linear-gradient(90deg, rgba(7,7,12,0.92) 0%, rgba(7,7,12,0.55) 38%, transparent 62%); }
  .banner .info { position: relative; padding: 28px 30px; width: 100%; }
  .banner .info-txt { min-width: 0; max-width: 62%; }
  @media (max-width: 560px) { .banner .portrait { width: 60%; } .banner .info-txt { max-width: 78%; } }
  .banner h1 { font-family: var(--disp); font-weight: 800; font-size: clamp(34px,6vw,60px); letter-spacing: 2px; line-height: 1; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .tg { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: rgba(20,18,32,0.7); border: 1px solid var(--line); letter-spacing: 0.5px; }
  .tg.cls { color: var(--gold); border-color: rgba(232,201,134,0.4); }
  .tg.lane { color: var(--blue); }
  .meta { display: flex; gap: 26px; margin-top: 16px; flex-wrap: wrap; }
  .meta .m b { font-family: var(--disp); font-size: 20px; } .meta .m span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; display: block; }
  .meta .good { color: var(--green); } .meta .bad { color: var(--red); }

  section.blk { margin-top: 40px; }
  .blk-h { font-family: var(--disp); font-weight: 700; font-size: 22px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 18px; display: flex; align-items: center; gap: 12px; }
  .blk-h .badge { font-family: var(--body); font-size: 11px; letter-spacing: 1px; color: var(--gold); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; text-transform: uppercase; }
  .blk-h::before { content:""; width: 4px; height: 22px; background: var(--grad-gold); border-radius: 2px; }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .stat .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .stat .lbl b { color: var(--gold); font-family: var(--disp); }
  .stat .track { height: 7px; background: rgba(255,255,255,0.07); border-radius: 4px; overflow: hidden; }
  .stat .fill { height: 100%; background: var(--grad-gold); border-radius: 4px; }

  /* skills */
  .skill { display: flex; gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 12px; }
  .skill .ic { width: 58px; height: 58px; border-radius: 12px; border: 1px solid var(--line); object-fit: cover; flex-shrink: 0; background: var(--bg2); }
  .skill .sh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .skill .sn { font-family: var(--disp); font-weight: 700; font-size: 18px; letter-spacing: 0.5px; }
  .skill .st { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); border: 1px solid rgba(232,201,134,0.4); border-radius: 6px; padding: 2px 8px; }
  .skill .atag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid; border-radius: 5px; padding: 2px 7px; }
  .skill .cd { font-size: 12px; color: var(--muted); }
  .skill .sd { font-size: 14px; color: #cfc8bb; white-space: pre-line; }
  .skill .sd span { font-weight: 600; }

  /* skins */
  .skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 14px; }
  .skin { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform .18s, border-color .18s, box-shadow .18s; }
  .skin:hover { transform: translateY(-4px); border-color: rgba(232,201,134,0.55); box-shadow: 0 14px 30px -14px rgba(0,0,0,0.75); }
  .skin .sp { aspect-ratio: 3/4; background-size: cover; background-position: center top; background-color: var(--bg2); }
  .skin .snm { padding: 10px 10px; font-size: 12px; font-weight: 600; text-align: center; color: var(--gold-bright); line-height: 1.25; }

  /* lightbox */
  .lb { position: fixed; inset: 0; z-index: 100; background: rgba(4,4,8,0.93); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; padding: 34px; }
  .lb.open { display: flex; }
  .lb img { max-width: 95vw; max-height: 84vh; border-radius: 14px; border: 1px solid var(--line); box-shadow: 0 30px 90px -20px rgba(0,0,0,0.9); }
  .lb .cap { position: absolute; bottom: 26px; left: 0; right: 0; text-align: center; font-family: var(--disp); font-weight: 700; font-size: clamp(18px,3vw,26px); letter-spacing: 1px; color: var(--gold); text-shadow: 0 2px 12px #000; padding: 0 20px; }
  .lb .x { position: absolute; top: 18px; right: 22px; width: 44px; height: 44px; border-radius: 11px; border: 1px solid var(--line); background: rgba(20,18,32,0.75); color: var(--text); font-size: 24px; cursor: pointer; display: grid; place-items: center; }
  .lb .x:hover { border-color: var(--gold); color: var(--gold); }
  .lb .hint { position: absolute; top: 24px; left: 24px; font-size: 12px; color: var(--muted); letter-spacing: 0.5px; }

  /* build cards (read-only) */
  .build { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 14px; }
  .build .bhead { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line-soft); }
  .bidx { font-family: var(--disp); font-weight: 700; letter-spacing: 1px; font-size: 16px; color: var(--gold); }
  .spellp { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; }
  .spellp img { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); object-fit: cover; }
  .bld-ctrls { margin-left: auto; display: flex; gap: 8px; }
  .mini { font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; }
  .mini:hover { border-color: var(--gold); color: var(--gold); }
  .mini.del:hover { border-color: var(--red); color: var(--red); }
  .build .seg { margin-bottom: 18px; } .build .seg:last-child { margin-bottom: 0; }
  .build .seg .t { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .items { display: flex; gap: 10px; flex-wrap: wrap; }
  .it { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 66px; }
  .it img { width: 54px; height: 54px; border-radius: 10px; border: 1px solid var(--line); object-fit: cover; }
  .it .ord { position: absolute; top: -4px; left: 6px; width: 17px; height: 17px; border-radius: 50%; background: var(--grad-gold); color: #1a1205; font-size: 10px; font-weight: 800; display: grid; place-items: center; z-index: 2; }
  .it span:last-child { font-size: 10px; color: var(--muted); text-align: center; line-height: 1.15; }
  .embrow { display: flex; gap: 34px; flex-wrap: wrap; align-items: flex-start; }
  .emain { display: flex; align-items: center; gap: 11px; }
  .emain img { width: 52px; height: 52px; border-radius: 11px; border: 1px solid rgba(232,201,134,0.4); object-fit: cover; }
  .emain .emn { font-family: var(--disp); font-weight: 700; font-size: 16px; color: var(--gold); }
  .talents { display: flex; gap: 12px; flex-wrap: wrap; }
  .tal { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 70px; }
  .tal img { width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--line); object-fit: cover; }
  .tal span { font-size: 10px; color: var(--muted); text-align: center; line-height: 1.15; }
  .cnone { font-size: 13px; color: var(--muted); padding: 4px 0 8px; }

  /* CONSTRUCTOR (edit mode) */
  .editor { background: var(--panel); border: 1px solid rgba(232,201,134,0.3); border-radius: 14px; padding: 22px; margin-top: 18px; }
  .ed-head { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
  .name-input { flex: 1; min-width: 200px; background: var(--bg2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 13px; color: var(--text); font-family: var(--body); font-size: 14px; outline: none; }
  .name-input:focus { border-color: var(--gold); }
  .ed-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { font-size: 13px; font-weight: 600; padding: 9px 15px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; transition: all .15s; }
  .btn:hover { border-color: var(--gold); }
  .btn-gold { background: var(--grad-gold); color: #1a1205; border-color: transparent; }
  .btn-gold:hover { filter: brightness(1.07); }
  .ed-slots { display: flex; gap: 30px; flex-wrap: wrap; margin-bottom: 22px; }
  .slot-group .t { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .slots { display: flex; gap: 10px; flex-wrap: wrap; }
  .slot { position: relative; width: 54px; height: 54px; border: 1.5px dashed rgba(255,255,255,0.18); border-radius: 10px; display: grid; place-items: center; cursor: pointer; background: var(--bg2); transition: border-color .15s; margin-bottom: 16px; }
  .slot:hover { border-color: var(--gold); }
  .slot.filled { border-style: solid; border-color: var(--line); }
  .slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 9px; }
  .slot .plus { color: var(--muted); font-size: 22px; font-weight: 300; }
  .slot .slbl { position: absolute; bottom: -15px; left: -4px; right: -4px; text-align: center; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .slot.filled .slbl { color: var(--gold-deep); }

  .lib { border-top: 1px solid var(--line-soft); padding-top: 18px; }
  .lib-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .lib-tab { font-size: 13px; font-weight: 600; padding: 7px 15px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .lib-tab:hover { color: var(--gold-bright); }
  .lib-tab.on { background: var(--grad-gold); color: #1a1205; border-color: transparent; }
  .lib-searchrow { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .lib-search { flex: 1; background: var(--bg2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; color: var(--text); font-family: var(--body); font-size: 14px; outline: none; }
  .lib-search:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,201,134,0.12); }
  .lib-count { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .lib-tier { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin: 10px 0 8px; }
  .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; max-height: 320px; overflow-y: auto; padding: 2px 4px 2px 0; }
  .lib-item { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 4px; background: var(--bg2); border: 1px solid var(--line-soft); border-radius: 9px; cursor: pointer; color: var(--text); transition: border-color .12s, transform .12s; }
  .lib-item:hover { border-color: var(--gold); transform: translateY(-2px); }
  .lib-item img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
  .lib-item span { font-size: 9.5px; color: var(--muted); text-align: center; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--panel2); border: 1px solid var(--gold); color: var(--gold-bright); padding: 11px 22px; border-radius: 10px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s; z-index: 200; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .story { color: var(--muted); font-size: 15px; font-style: italic; max-width: 720px; }
  .loading, .errbox { text-align: center; color: var(--muted); padding: 80px 0; }
  footer { border-top: 1px solid var(--line); padding: 26px 0 44px; margin-top: 50px; color: var(--muted); font-size: 12px; text-align: center; }
  footer a { color: var(--gold); }
</style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="back" href="./index.html">‹ All heroes</a>
      <div class="brand gold-text">MLBB CODEX</div>
    </div>
  </header>

  <div class="wrap" id="root"><div class="loading">Loading hero…</div></div>

  <footer>Data: open MLBB API &amp; Moonton · made by <a href="https://caliskel.github.io" target="_blank" rel="noopener">caliskel</a></footer>

  <div class="lb" id="lb"><span class="hint">click outside or Esc to close</span><button class="x" id="lbx" aria-label="Close">×</button><img id="lbimg" alt="" /><div class="cap" id="lbcap"></div></div>
  <div class="toast" id="toast"></div>

  <script src="./data/heroes.js"></script>
  <script>
    const ROSTER = (window.MLBB_HEROES || []);
    const byId = {}; ROSTER.forEach(h => byId[h.id] = h);
    const ROLE_EN = { "Exp Lane":"EXP","Gold Lane":"GOLD","Jungle":"JUNGLE","Mid Lane":"MID","Roam":"ROAM" };
    const STAT_LABELS = ["Durability","Offense","Ability Effects","Difficulty"];
    const params = new URLSearchParams(location.search);
    const id = +(params.get("id"));
    const EDIT = params.has("edit");
    const root = document.getElementById("root");

    function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    function wrCls(w){ return w==null?"":(w>=50?"good":"bad"); }
    function pct(v){ return v==null?"—":v.toFixed(1)+"%"; }

    /* ---------- catalog + lookups ---------- */
    let CATALOG=null, DETAIL=null;
    const M = { item:{}, spell:{}, talent:{}, emblem:{} };
    function buildMaps(){
      if(!CATALOG) return;
      (CATALOG.items||[]).forEach(x=>M.item[x.id]=x);
      (CATALOG.spells||[]).forEach(x=>M.spell[x.id]=x);
      (CATALOG.talents||[]).forEach(x=>M.talent[x.id]=x);
      (CATALOG.emblems||[]).forEach(x=>M.emblem[x.name]=x);
    }

    /* ---------- builds storage ---------- */
    const LS="mlbb_builds_v1";
    function allBuilds(){ try{ return JSON.parse(localStorage.getItem(LS))||{}; }catch(e){ return {}; } }
    function getBuilds(hid){ return allBuilds()[hid] || []; }
    function setBuilds(hid, arr){ const a=allBuilds(); if(arr&&arr.length) a[hid]=arr; else delete a[hid]; localStorage.setItem(LS, JSON.stringify(a)); }

    let editing = newEditing();
    function newEditing(){ return { name:"", items:[null,null,null,null,null,null], spell:null, emblem:null, talents:[null,null,null], editIndex:null, libTab:"items", libQ:"" }; }

    function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800); }

    /* ---------- page render ---------- */
    function render(d){
      const r = byId[id] || {};
      const name = d.name || r.name || "Hero";
      document.title = name + " — MLBB Codex";
      const clean = a => (a||[]).map(x=>(x==null?'':(''+x)).trim()).filter(Boolean);
      const cls = clean(d.cls).map(c=>'<span class="tg cls">'+esc(c)+'</span>').join('');
      const laneSrc = clean(d.lanes).length ? clean(d.lanes) : clean((r.roles||[]).map(x=>ROLE_EN[x]||x));
      const lanes = laneSrc.map(l=>'<span class="tg lane">'+esc(l)+'</span>').join('');
      const spec = clean(d.specialty).map(s=>'<span class="tg">'+esc(s)+'</span>').join('');

      const meta = '<div class="meta">' +
        (r.win!=null?'<div class="m"><b class="'+wrCls(r.win)+'">'+pct(r.win)+'</b><span>Win rate</span></div>':'') +
        (r.ban!=null?'<div class="m"><b>'+pct(r.ban)+'</b><span>Ban rate</span></div>':'') +
        (r.pick!=null?'<div class="m"><b>'+pct(r.pick)+'</b><span>Pick rate</span></div>':'') +
        (d.difficulty?'<div class="m"><b>'+d.difficulty+'</b><span>Difficulty</span></div>':'') + '</div>';

      const stats = (d.stats&&d.stats.length)? '<section class="blk"><div class="blk-h">Attributes</div><div class="stats">' +
        d.stats.map((v,i)=>{const val=Math.max(0,Math.min(100,parseInt(v)||0));
          return '<div class="stat"><div class="lbl">'+(STAT_LABELS[i]||('Stat '+(i+1)))+'<b>'+val+'</b></div><div class="track"><div class="fill" style="width:'+val+'%"></div></div></div>';}).join('') +
        '</div></section>' : '';

      const slot = (i,n)=> i===0?"Passive":(i===n-1?"Ultimate":"Skill "+i);
      const abilityTags = (tag)=> Array.isArray(tag)? tag.filter(t=>t&&t.tagname).map(t=>'<span class="atag" style="color:rgb('+(t.tagrgb||"154,145,127")+');border-color:rgba('+(t.tagrgb||"154,145,127")+',0.4)">'+esc(t.tagname)+'</span>').join('') : '';
      const skills = (d.skills&&d.skills.length)? '<section class="blk"><div class="blk-h">Skills</div>' +
        d.skills.map((s,i,arr)=>'<div class="skill">'+(s.icon?'<img class="ic" src="'+s.icon+'"/>':'<div class="ic"></div>')+
          '<div style="flex:1"><div class="sh"><span class="sn">'+esc(s.name)+'</span><span class="st">'+slot(i,arr.length)+'</span>'+abilityTags(s.tag)+(s.cdcost?'<span class="cd">'+esc(s.cdcost)+'</span>':'')+'</div><div class="sd">'+(s.desc||'')+'</div></div></div>').join('') +
        '</section>' : '';

      const story = d.story? '<section class="blk"><div class="blk-h">Lore</div><p class="story">'+esc(d.story)+'</p></section>' : '';

      const skins = (d.skins && d.skins.length) ? '<section class="blk"><div class="blk-h">Skins <span class="badge">'+d.skins.length+'</span></div><div class="skins">' +
        d.skins.filter(s=>s&&s.img).map(s=>{ var full=s.full ? s.full : (s.img||'').replace(/\/scale-to-width-down\/\d+/,''); var nm=esc(s.name||'Skin');
          return '<div class="skin" data-full="'+full+'" data-name="'+nm+'"><div class="sp" style="background-image:url(\''+s.img+'\')"></div><div class="snm">'+nm+'</div></div>'; }).join('') +
        '</div></section>' : '';

      root.innerHTML =
        '<div class="banner"><div class="art" style="background-image:url(\''+(d.splash||r.img)+'\')"></div>' +
          '<div class="portrait" style="background-image:url(\''+(d.splash||r.img)+'\')"></div>' +
          '<div class="scrim"></div>' +
          '<div class="info"><div class="info-txt"><h1 class="gold-text">'+esc(name)+'</h1><div class="tags">'+cls+lanes+spec+'</div>'+meta+'</div></div></div>' +
        stats + skins + skills +
        '<section class="blk"><div class="blk-h">Builds'+(EDIT?' <span class="badge">editor</span>':'')+'</div><div id="buildsArea"></div></section>' +
        story;

      renderBuilds();
    }

    /* ---------- builds rendering ---------- */
    function buildCard(b, i){
      const items=(b.items||[]).map((iid,idx)=>{const o=M.item[iid]; return o?'<div class="it"><span class="ord">'+(idx+1)+'</span><img loading="lazy" src="'+o.icon+'"/><span>'+esc(o.name)+'</span></div>':'';}).join('');
      const sp=M.spell[b.spell];
      const em=M.emblem[b.emblem];
      const tals=(b.talents||[]).map(tid=>M.talent[tid]).filter(Boolean).sort((a,c)=>(a.tier||0)-(c.tier||0)).map(t=>'<div class="tal"><img src="'+t.icon+'"/><span>'+esc(t.name)+'</span></div>').join('');
      const ctrls = EDIT? '<span class="bld-ctrls"><button class="mini" data-act="edit" data-i="'+i+'">Edit</button><button class="mini del" data-act="del" data-i="'+i+'">Delete</button></span>':'';
      return '<div class="build">' +
        '<div class="bhead"><span class="bidx">'+esc(b.name||('Build '+(i+1)))+'</span>' +
          (sp?'<span class="spellp"><img src="'+sp.icon+'"/>'+esc(sp.name)+'</span>':'') + ctrls + '</div>' +
        (items?'<div class="seg"><div class="t">Items</div><div class="items">'+items+'</div></div>':'') +
        ((em||tals)?'<div class="seg embrow">' +
          (em?'<div class="emain"><img src="'+em.icon+'"/><div><div class="t" style="margin:0">Emblem</div><div class="emn">'+esc(em.name)+'</div></div></div>':'') +
          (tals?'<div class="taltrack"><div class="t">Talents</div><div class="talents">'+tals+'</div></div>':'') +
        '</div>':'') +
      '</div>';
    }

    function slotBox(kind, i, obj, label){
      const inner = obj? '<img src="'+obj.icon+'"/>' : '<span class="plus">+</span>';
      const cls = obj? 'slot filled':'slot';
      const title = obj? esc(obj.name)+' — click to clear' : (label||'empty');
      return '<div class="'+cls+'" data-slot="'+kind+'"'+(i!=null?' data-i="'+i+'"':'')+' title="'+title+'">'+inner+(label?'<span class="slbl">'+label+'</span>':'')+'</div>';
    }

    function editorHTML(){
      const e=editing;
      const itemSlots=e.items.map((iid,i)=>slotBox('item',i,M.item[iid],'')).join('');
      const spellSlot=slotBox('spell',null,M.spell[e.spell],'Spell');
      const emblemSlot=slotBox('emblem',null,M.emblem[e.emblem],'Emblem');
      const talSlots=[0,1,2].map(i=>slotBox('talent',i,M.talent[e.talents[i]],'T'+(i+1))).join('');
      const tab=e.libTab||'items';
      let lib='';
      if(tab==='items'){
        lib='<div class="lib-searchrow"><input class="lib-search" id="libsearch" placeholder="Search items by name…" value="'+esc(e.libQ||'')+'" autocomplete="off"/><span class="lib-count" id="libcount"></span></div>'+
          '<div class="lib-grid">'+CATALOG.items.map(x=>'<button class="lib-item" data-add="item" data-id="'+x.id+'"><img loading="lazy" src="'+x.icon+'"/><span>'+esc(x.name)+'</span></button>').join('')+'</div>';
      } else if(tab==='spells'){
        lib='<div class="lib-grid">'+CATALOG.spells.map(x=>'<button class="lib-item" data-add="spell" data-id="'+x.id+'"><img src="'+x.icon+'"/><span>'+esc(x.name)+'</span></button>').join('')+'</div>';
      } else if(tab==='emblems'){
        lib='<div class="lib-grid">'+CATALOG.emblems.map(x=>'<button class="lib-item" data-add="emblem" data-name="'+esc(x.name)+'"><img src="'+x.icon+'"/><span>'+esc(x.name)+'</span></button>').join('')+'</div>';
      } else {
        lib=[1,2,3].map(tr=>'<div class="lib-tier">Tier '+tr+'</div><div class="lib-grid">'+CATALOG.talents.filter(t=>t.tier===tr).map(x=>'<button class="lib-item" data-add="talent" data-id="'+x.id+'"><img src="'+x.icon+'"/><span>'+esc(x.name)+'</span></button>').join('')+'</div>').join('');
      }
      const tb=(k,l)=>'<button class="lib-tab'+(tab===k?' on':'')+'" data-tab="'+k+'">'+l+'</button>';
      return '<div class="editor">' +
        '<div class="ed-head"><input class="name-input" id="bname" placeholder="Build name (e.g. Burst, Tanky, Lane)" value="'+esc(e.name||'')+'"/>' +
          '<div class="ed-actions">' +
            '<button class="btn btn-gold" data-act="save">'+(e.editIndex!=null?'Update build':'Save build')+'</button>' +
            '<button class="btn" data-act="clear">New / clear</button>' +
            '<button class="btn" data-act="export">Export JSON</button>' +
          '</div></div>' +
        '<div class="ed-slots">' +
          '<div class="slot-group"><div class="t">Items · 6</div><div class="slots">'+itemSlots+'</div></div>' +
          '<div class="slot-group"><div class="t">Spell · Emblem · Talents</div><div class="slots">'+spellSlot+emblemSlot+talSlots+'</div></div>' +
        '</div>' +
        '<div class="lib"><div class="lib-tabs">'+tb('items','Items')+tb('spells','Spells')+tb('emblems','Emblems')+tb('talents','Talents')+'</div>'+lib+'</div>' +
      '</div>';
    }

    function renderBuilds(){
      const area=document.getElementById("buildsArea"); if(!area) return;
      if(!CATALOG){ area.innerHTML='<div class="cnone">Loading catalog…</div>'; return; }
      const list = EDIT ? getBuilds(id) : ((DETAIL&&DETAIL.builds)||[]);
      let html='';
      if(list.length){ html += list.map((b,i)=>buildCard(b,i)).join(''); }
      else { html += '<div class="cnone">'+(EDIT?'No builds yet — assemble one below and Save.':'No builds yet.')+'</div>'; }
      if(EDIT){ html += editorHTML(); }
      area.innerHTML=html;
      if(EDIT && editing.libTab==='items') applyItemFilter();
    }

    function applyItemFilter(){
      const grid=document.querySelector('.lib-grid'); if(!grid) return;
      const words=(editing.libQ||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
      let n=0, total=0;
      grid.querySelectorAll('.lib-item').forEach(b=>{ total++; const nm=b.querySelector('span').textContent.toLowerCase();
        const show = !words.length || words.every(w=>nm.includes(w));
        b.style.display=show?'':'none'; if(show) n++; });
      const c=document.getElementById('libcount'); if(c) c.textContent = words.length ? (n+' / '+total) : (total+' items');
    }

    /* ---------- editing actions ---------- */
    function addToBuild(kind, ds){
      if(kind==='item'){ const i=editing.items.indexOf(null); if(i>=0) editing.items[i]=+ds.id; else editing.items[5]=+ds.id; }
      else if(kind==='spell'){ editing.spell=+ds.id; }
      else if(kind==='emblem'){ editing.emblem=ds.name; }
      else if(kind==='talent'){ const t=M.talent[+ds.id]; if(t) editing.talents[(t.tier||1)-1]=+ds.id; }
    }
    function clearSlot(kind, i){
      if(kind==='item') editing.items[+i]=null;
      else if(kind==='spell') editing.spell=null;
      else if(kind==='emblem') editing.emblem=null;
      else if(kind==='talent') editing.talents[+i]=null;
    }
    function saveBuild(){
      const arr=getBuilds(id);
      const hasAny = editing.items.some(Boolean)||editing.spell||editing.emblem||editing.talents.some(Boolean);
      if(!hasAny){ toast('Build is empty'); return; }
      const b={ name: (editing.name||'').trim()||('Build '+(arr.length+1)), items: editing.items.slice(), spell: editing.spell, emblem: editing.emblem, talents: editing.talents.slice() };
      if(editing.editIndex!=null && arr[editing.editIndex]) arr[editing.editIndex]=b; else arr.push(b);
      setBuilds(id, arr);
      const tab=editing.libTab; editing=newEditing(); editing.libTab=tab;
      renderBuilds(); toast('Saved');
    }
    function loadForEdit(i){
      const b=getBuilds(id)[i]; if(!b) return;
      editing={ name:b.name||'', items:(b.items||[]).concat([null,null,null,null,null,null]).slice(0,6),
        spell:(b.spell??null), emblem:(b.emblem??null), talents:(b.talents||[]).concat([null,null,null]).slice(0,3),
        editIndex:i, libTab:editing.libTab||'items', libQ:'' };
      renderBuilds();
      document.querySelector('.editor') && document.querySelector('.editor').scrollIntoView({behavior:'smooth', block:'center'});
    }
    function delBuild(i){ const arr=getBuilds(id); arr.splice(i,1); setBuilds(id, arr); if(editing.editIndex===i) editing=newEditing(); renderBuilds(); }
    function exportJSON(){
      const data=JSON.stringify(allBuilds(), null, 2);
      if(navigator.clipboard) navigator.clipboard.writeText(data).catch(()=>{});
      try{ const blob=new Blob([data],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mlbb-builds.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);}catch(e){}
      toast('Exported — file + clipboard');
    }

    /* ---------- delegated events (bound once) ---------- */
    document.addEventListener('click', (e)=>{
      const tab=e.target.closest('.lib-tab'); if(tab){ editing.libTab=tab.dataset.tab; renderBuilds(); return; }
      const add=e.target.closest('[data-add]'); if(add){ addToBuild(add.dataset.add, add.dataset); renderBuilds(); return; }
      const sl=e.target.closest('.slot.filled'); if(sl){ clearSlot(sl.dataset.slot, sl.dataset.i); renderBuilds(); return; }
      const act=e.target.closest('[data-act]'); if(act){ const a=act.dataset.act;
        if(a==='save') saveBuild(); else if(a==='clear'){ editing=newEditing(); renderBuilds(); }
        else if(a==='edit') loadForEdit(+act.dataset.i); else if(a==='del') delBuild(+act.dataset.i);
        else if(a==='export') exportJSON();
        return; }
    });
    document.addEventListener('input', (e)=>{
      if(e.target.id==='bname'){ editing.name=e.target.value; }
      else if(e.target.id==='libsearch'){ editing.libQ=e.target.value; applyItemFilter(); }
    });

    /* ---------- lightbox ---------- */
    const lb=document.getElementById('lb'), lbimg=document.getElementById('lbimg'), lbcap=document.getElementById('lbcap');
    function closeLB(){ lb.classList.remove('open'); lbimg.src=''; document.body.style.overflow=''; }
    document.addEventListener('click', (e)=>{ const s=e.target.closest('.skin'); if(s && s.dataset.full){ lbimg.src=s.dataset.full; lbcap.textContent=s.dataset.name||''; lb.classList.add('open'); document.body.style.overflow='hidden'; } });
    document.getElementById('lbx').addEventListener('click', closeLB);
    lb.addEventListener('click', (e)=>{ if(e.target===lb || e.target===lbimg) closeLB(); });
    addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeLB(); });

    /* ---------- boot ---------- */
    if(!id || !byId[id]){ root.innerHTML='<div class="errbox">Hero not found. <a href="./index.html" style="color:var(--gold)">Back to all heroes ›</a></div>'; }
    else {
      render({});
      Promise.all([
        fetch('./data/heroes/'+id+'.json').then(r=>r.ok?r.json():null).catch(()=>null),
        fetch('./data/catalog.json').then(r=>r.ok?r.json():null).catch(()=>null)
      ]).then(([d,cat])=>{ DETAIL=d||{}; CATALOG=cat; buildMaps(); render(DETAIL); });
    }
  </script>
</body>
</html>
